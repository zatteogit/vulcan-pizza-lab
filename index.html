<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#FDFBF7" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#131211" />
    <title>Vulcan Pizza Lab</title>
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32x32.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180" />
    <link rel="manifest" href="/site.webmanifest" />
    <script>
      /* Anti-FOUC: applica il tema salvato PRIMA del primo paint, così gli
         utenti dark non vedono il flash bianco. Stessa chiave/semantica di
         app-shell.tsx (vulcan_dark_mode: light | dark | auto, legacy true/false). */
      (function () {
        try {
          var mode = localStorage.getItem("vulcan_dark_mode");
          var dark =
            mode === "dark" ||
            mode === "true" ||
            ((mode === null || mode === "auto") &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          var el = document.documentElement;
          if (dark) el.classList.add("dark");
          /* Tema rivista di cucina scelto (fase esplorativa): applicato prima
             del primo paint per evitare il flash del tema di default.
             ?theme=… nell'URL vince e viene persistito (deep-link condivisibile). */
          var qTheme = new URLSearchParams(window.location.search).get("theme");
          if (qTheme !== null) {
            localStorage.setItem("vulcan_theme", qTheme);
          }
          var theme = qTheme !== null ? qTheme : localStorage.getItem("vulcan_theme");
          if (theme) el.setAttribute("data-theme", theme);
          /* Colore diretto: copre il gap prima che theme.css sia caricato. */
          el.style.backgroundColor = dark ? "#131211" : "#fdfbf7";
        } catch (e) {
          /* storage inaccessibile: resta il default chiaro */
        }
      })();
    </script>
    <style>
      /* Splash di avvio — vive dentro #root: al mount React lo sostituisce
         da solo, nessuno script di rimozione. Valori hardcoded a ragion
         veduta: theme.css non è ancora arrivato. */
      #vulcan-splash {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #fdfbf7;
      }
      html.dark #vulcan-splash {
        background: #131211;
      }
      #vulcan-splash svg {
        width: 52px;
        height: 52px;
        color: #c24a2f;
        animation: vulcan-splash-breathe 1.7s ease-in-out infinite;
      }
      @keyframes vulcan-splash-breathe {
        0%,
        100% {
          opacity: 0.35;
          transform: scale(0.94);
        }
        50% {
          opacity: 1;
          transform: scale(1);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #vulcan-splash svg {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="vulcan-splash" aria-hidden="true">
        <!-- VulcanMark, variante NATURALE (vulcan-logo.tsx) -->
        <svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg" focusable="false">
          <defs>
            <linearGradient id="vulcan-splash-ember" x1="0.12" y1="0" x2="0.9" y2="1">
              <stop offset="0%" stop-color="#f36b3d" />
              <stop offset="48%" stop-color="#ea4e27" />
              <stop offset="100%" stop-color="#b93620" />
            </linearGradient>
          </defs>
          <path d="M4.8 1.5H11.31Q11.41 1.5 11.41 1.6L11.25 19.71L4.61 1.77Q4.56 1.64 4.66 1.54Q4.72 1.5 4.8 1.5ZM19.18 1.58C19.19 1.53 19.23 1.5 19.29 1.5H28.12C29.3 1.5 29.92 2.54 29.44 3.62L17.42 28.28C16.46 30.11 14.8 30.23 13.67 29.43C12.72 28.77 12.73 27.85 13.06 26.43L19.18 1.58Z" fill="url(#vulcan-splash-ember)" fill-rule="nonzero" />
        </svg>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
