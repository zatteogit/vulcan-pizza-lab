name: deploy-test

# Ogni merge su main va in test, con lo stesso commit (docs/ambienti-ed-edizioni.md):
#   · generalista → vulcan-test (strumenti accesi, D1 di test);
#   · ogni edizione dedicata → vulcan-<id>-test (dietro Cloudflare Access).
# Le edizioni dei marchi reali arrivano dal repository privato zatteogit/vulcan-editions
# (segreto VULCAN_EDITIONS_TOKEN, sola lettura). Senza segreti i job si fermano con
# un avviso, senza fallire. La produzione esce solo dal workflow deploy-production.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-test
  cancel-in-progress: true

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  VULCAN_EDITIONS_TOKEN: ${{ secrets.VULCAN_EDITIONS_TOKEN }}

jobs:
  generalist:
    runs-on: ubuntu-latest
    steps:
      - name: Segreti Cloudflare presenti?
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: echo "::notice::Ambiente di test non configurato (manca il segreto CLOUDFLARE_API_TOKEN). Vedi docs/ambiente-test.md."
      - uses: actions/checkout@v4
        if: env.CLOUDFLARE_API_TOKEN != ''
      - uses: actions/setup-node@v4
        if: env.CLOUDFLARE_API_TOKEN != ''
        with:
          node-version: 20
          cache: npm
      - if: env.CLOUDFLARE_API_TOKEN != ''
        run: npm ci
      - if: env.CLOUDFLARE_API_TOKEN != ''
        run: npm run verify
      - name: Build con gli strumenti accesi (solo test)
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: npm run build:test
      - name: Deploy su vulcan-test
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: npx wrangler deploy --env test

  list-editions:
    runs-on: ubuntu-latest
    outputs:
      editions: ${{ steps.list.outputs.editions }}
    steps:
      - uses: actions/checkout@v4
      - name: Edizioni private (repository vulcan-editions)
        if: env.VULCAN_EDITIONS_TOKEN != ''
        uses: actions/checkout@v4
        with:
          repository: zatteogit/vulcan-editions
          token: ${{ secrets.VULCAN_EDITIONS_TOKEN }}
          path: .editions-private
      - id: list
        run: |
          if [ -d .editions-private/editions ]; then export VULCAN_EDITIONS_DIR=.editions-private/editions; fi
          echo "editions=$(node scripts/list-editions.mjs)" >> "$GITHUB_OUTPUT"

  editions:
    needs: [generalist, list-editions]
    if: needs.list-editions.outputs.editions != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        edition: ${{ fromJSON(needs.list-editions.outputs.editions) }}
    steps:
      - name: Segreti Cloudflare presenti?
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: echo "::notice::Edizione ${{ matrix.edition }} non pubblicata: manca il segreto CLOUDFLARE_API_TOKEN."
      - uses: actions/checkout@v4
        if: env.CLOUDFLARE_API_TOKEN != ''
      - name: Edizioni private
        if: env.CLOUDFLARE_API_TOKEN != '' && env.VULCAN_EDITIONS_TOKEN != ''
        uses: actions/checkout@v4
        with:
          repository: zatteogit/vulcan-editions
          token: ${{ secrets.VULCAN_EDITIONS_TOKEN }}
          path: .editions-private
      - uses: actions/setup-node@v4
        if: env.CLOUDFLARE_API_TOKEN != ''
        with:
          node-version: 20
          cache: npm
      - if: env.CLOUDFLARE_API_TOKEN != ''
        run: npm ci
      - name: Deploy su vulcan-${{ matrix.edition }}-test
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: |
          if [ -d .editions-private/editions ]; then export VULCAN_EDITIONS_DIR=.editions-private/editions; fi
          node scripts/deploy-edition.mjs "${{ matrix.edition }}" test
