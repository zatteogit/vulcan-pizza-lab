# Cloudflare Worker config for the deployed app (…workers.dev).
#
# The Worker serves the built SPA via the ASSETS binding and handles
# /api/annotations against the D1 binding DB. Deployed by `wrangler deploy`
# (the Pages-only pitfalls from earlier do NOT apply here — this IS a Worker).
#
# One-time setup:
#   npx wrangler d1 execute vulcan-annotations --remote --file=./schema.sql
#   (D1 already created: id below. Binding travels in this file — no dashboard.)
#   Deploy: `npx wrangler deploy` (or the project's connected Workers build).
name = "vulcan-pizza-lab"
# Account Cloudflare (non è un segreto): basta il token API nella CI.
account_id = "ea8b6efff9e61cb1427a489488354518"
# D-049: il Worker include il motore per il server MCP (/mcp); lo costruisce
# scripts/build-worker.mjs (le immagini dei condimenti restano fuori) e
# wrangler carica il file prodotto senza ri-impacchettarlo.
main = ".worker-dist/index.js"
compatibility_date = "2024-11-01"
no_bundle = true

[build]
command = "node scripts/build-worker.mjs"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
# /mcp, accesso e API degli strumenti vanno al Worker anche quando il resto è
# servito dagli asset: senza, /api/annotations e /api/config in produzione
# finivano sul fallback SPA (200 con l'HTML) invece del 404 del Worker.
# D-061: /api/voice (Siri) e /alexa (skill Alexa) sono rotte del Worker.
run_worker_first = ["/mcp", "/api/voice", "/alexa", "/api/auth/*", "/api/annotations", "/api/config"]

# D-046: ruoli per impronta SHA-256 dell'email normalizzata (il repository è
# pubblico: niente email in chiaro). GOOGLE_CLIENT_ID è pubblico per natura;
# vuoto = accesso con Google spento. Elenchi separati da virgole.
[vars]
GOOGLE_CLIENT_ID = "216267907893-r6f22fhk3bg9u6v7jttukmocbobfg5m1.apps.googleusercontent.com"
ADMIN_EMAIL_SHA256 = "48d1cbb1b746c94b78a7c7c149d5500d0bc1117c948bd6730554c8c16954763f"
EDITOR_EMAIL_SHA256 = ""
TESTER_EMAIL_SHA256 = ""

[[d1_databases]]
binding = "DB"
database_name = "vulcan-annotations"
database_id = "471d2a9d-1a54-418e-849c-479b85cbd979"

# ── P-4: ambiente di test (vulcan-test) ─────────────────────────────────────
# Merge su main → deploy qui (workflow .github/workflows/deploy-test.yml);
# approvazione → produzione dello stesso commit. Accesso solo su invito con
# Cloudflare Access, noindex dal Worker, D1 separato con giurisdizione UE.
# Passi una tantum sull'account Cloudflare: docs/ambiente-test.md.
[env.test]
name = "vulcan-test"

[env.test.assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
# Il Worker gira prima degli asset: serve per l'header X-Robots-Tag su tutto.
run_worker_first = true

[env.test.vars]
DEPLOY_ENV = "test"
# Fail-closed: senza Cloudflare Access davanti il Worker risponde 403.
REQUIRE_ACCESS = "1"
# Le [vars] non si ereditano negli ambienti: stesse di produzione.
GOOGLE_CLIENT_ID = "216267907893-r6f22fhk3bg9u6v7jttukmocbobfg5m1.apps.googleusercontent.com"
ADMIN_EMAIL_SHA256 = "48d1cbb1b746c94b78a7c7c149d5500d0bc1117c948bd6730554c8c16954763f"
EDITOR_EMAIL_SHA256 = ""
TESTER_EMAIL_SHA256 = ""

[[env.test.d1_databases]]
binding = "DB"
database_name = "vulcan-test"
# Creato il 28/10/2026 con giurisdizione UE, schema.sql già caricato.
database_id = "f5c0620f-440b-4256-aced-2564c7cb5e87"

# ── Edizioni dedicate (docs/ambienti-ed-edizioni.md) ────────────────────────
# Un Worker per edizione e per ambiente, stesso codice di main:
#   npm run deploy:edition -- <id> test        → vulcan-<id>-test
#   npm run deploy:edition -- <id> production  → vulcan-<id>
# Il nome arriva da --name; NOINDEX=1 da --var per le edizioni noindex.
# Niente D1: accesso con Google e strumenti non esistono nelle edizioni.
[env.edition]
name = "vulcan-edition"

[env.edition.assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
# Il Worker gira prima degli asset: X-Robots-Tag anche su index.html.
run_worker_first = true

[env.edition.vars]
DEPLOY_ENV = "edition"
