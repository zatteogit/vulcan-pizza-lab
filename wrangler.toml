# Cloudflare Pages + D1 config for the AI debug overlay annotation store.
#
# One-time setup (run with the Cloudflare CLI, logged into your account):
#   npx wrangler d1 create vulcan-annotations
#     → copy the printed database_id into `database_id` below
#   npx wrangler d1 execute vulcan-annotations --remote --file=./schema.sql
#
# Optional soft write-gate (recommended for a public deployment):
#   npx wrangler pages secret put ANNOTATIONS_KEY
#     → then set VITE_ANNOTATIONS_KEY to the same value at build time
#
# Local dev against D1 without deploying (serves functions + a local D1):
#   npx wrangler pages dev -- npm run dev
#
name = "vulcan-pizza-lab"
pages_build_output_dir = "dist"
compatibility_date = "2024-11-01"

[[d1_databases]]
binding = "DB"
database_name = "vulcan-annotations"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"
